[project]
name = "tp5"
version = "0.1.0"
description = "Deep learning: autoencoders (basic, denoising, variational)"
readme = "README.md"
authors = [
    { name = "Tobias-Noceda", email = "tnoceda@itba.edu.ar" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "pyqt6>=6.11.0",
    "tqdm>=4.70.0",
]

[project.scripts]
tp5 = "tp5:main"
noisy = "tp5.tools.noisy:main"
ej1a-sweep = "tp5.tools.ej1a_sweep:main"
ej1a-analysis = "tp5.tools.ej1a_analysis:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
