[project]
name = "tp5"
version = "0.1.0"
description = "Deep learning: autoencoders (basic, denoising, variational)"
readme = "README.md"
authors = [
    { name = "Tobias-Noceda", email = "tnoceda@itba.edu.ar" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "pyqt6>=6.11.0",
    "tqdm>=4.70.0",
]

[project.scripts]
tp5 = "tp5:main"
noisy = "tp5.tools.noisy:main"
prepare-images = "tp5.tools.prepare_images:main"
ej1a-sweep = "tp5.experiments.ej1a_sweep:main"
ej1a-analysis = "tp5.analysis.ej1a:main"
ej1b-sweep = "tp5.experiments.ej1b_sweep:main"
ej1b-analysis = "tp5.analysis.ej1b:main"
emoji-dataset = "tp5.tools.emoji_dataset:main"
ej2-sweep = "tp5.experiments.ej2_sweep:main"
ej2-analysis = "tp5.analysis.ej2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
