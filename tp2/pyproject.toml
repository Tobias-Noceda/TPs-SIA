[project]
name = "tp2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tomás Raiti", email = "46955459+Secreto31126@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "multiprocess>=0.70.19",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "scikit-image>=0.26.0",
    "tqdm>=4.70.0",
]

[project.scripts]
